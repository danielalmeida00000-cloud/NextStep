<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 360px; font-family: system-ui, sans-serif; padding: 14px; }
    h3 { margin: 0 0 6px 0; color: #0F2744; }
    textarea { width: 100%; height: 100px; font-size: 12px; margin: 8px 0; box-sizing: border-box; }
    button { width: 100%; padding: 10px; margin-top: 6px; background: #1A73E8; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 500; }
    button:hover { background: #1557b0; }
    .note { font-size: 11px; color: #5F6368; margin-top: 10px; line-height: 1.4; }
  </style>
</head>
<body>
  <h3>🚗 Car Poster Pro</h3>
  <p style="font-size:13px; margin:0;">Paste vehicle data from the app, then fill the Marketplace form.</p>
  <textarea id="dataBox" placeholder='Paste JSON from the app here'></textarea>
  <button id="fillBtn">Fill Marketplace Form</button>
  <button id="demoBtn" style="background:#5F6368;">Use Demo Vehicle</button>
  <div class="note">
    • Works best on the Create Listing → Vehicle page<br>
    • Photos still need to be uploaded manually<br>
    • Always review before publishing
  </div>
  <script src="popup.js"></script>
</body>
</html>
