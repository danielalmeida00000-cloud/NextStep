<!doctype html>
<html>
  <head>
    <title>Facebook Marketplace vehicle</title>
  </head>
  <body>
    <button id="vehicle-type-button" type="button" role="button">Car/Truck</button>
    <label>
      <span>Vehicle type</span>
      <input id="vehicle-type" role="combobox" aria-label="Vehicle type" />
    </label>
    <div role="listbox">
      <div role="option">Car/Truck</div>
    </div>
    <label>
      <span>Year</span>
      <input id="year" role="combobox" aria-label="Year" />
    </label>
    <div role="listbox">
      <div role="option">2020</div>
      <div role="option">2021</div>
      <div role="option">2022</div>
    </div>
    <label>
      <span>Exterior color</span>
      <input id="exterior" role="combobox" aria-label="Exterior color" />
    </label>
    <div role="listbox">
      <div role="option">Black</div>
      <div role="option">Blue</div>
      <div role="option">Gray</div>
      <div role="option">Red</div>
      <div role="option">White</div>
      <div role="option">Other</div>
    </div>
    <label>
      <span>VIN</span>
      <input id="vin" aria-label="VIN" />
    </label>
    <button id="publish" type="button" role="button">Publish</button>
  </body>
</html>
